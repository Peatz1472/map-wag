<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E0E10">
<title>Wash&Go · CS Branch Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<style>
  :root {
    --yellow: #FFC400;
    --yellow-deep: #FFB300;
    --yellow-soft: #FFF4C4;
    --yellow-tint: #FFFAE6;
    --orange: #FF6B1A;
    --orange-deep: #E04E00;
    --orange-soft: #FFE4D2;
    --ink: #0E0E10;
    --ink-2: #1C1C20;
    --ink-3: #2A2A30;
    --slate: #6B6B75;
    --slate-soft: #A0A0AA;
    --line: #E8E8EA;
    --line-soft: #F1F1F3;
    --paper: #FAFAF7;
    --white: #FFFFFF;
    --shadow: 0 8px 24px rgba(14,14,16,0.08);
    --shadow-lg: 0 16px 48px rgba(14,14,16,0.16);
    --radius: 12px;
    --font-display: 'Plus Jakarta Sans', 'IBM Plex Sans Thai', sans-serif;
    --font-body: 'IBM Plex Sans Thai', 'Plus Jakarta Sans', sans-serif;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --sidebar-w: 340px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: var(--font-body);
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  button { font-family: inherit; cursor: pointer; border: none; background: none; -webkit-tap-highlight-color: transparent; }
  input { font-family: inherit; -webkit-appearance: none; }

  /* ===== APP LAYOUT — DESKTOP DEFAULT ===== */
  .app {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    height: 100vh;
    height: 100dvh;
  }

  /* Force sidebar to LEFT column, map to RIGHT column regardless of DOM order */
  .sidebar { grid-column: 1; grid-row: 1; }
  .map-wrap { grid-column: 2; grid-row: 1; }

  .sidebar {
    background: var(--white);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }

  /* ===== Brand Header (COMPACT) ===== */
  .brand {
    background: var(--ink);
    color: var(--white);
    padding: 9px 12px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }
  .brand::before {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 80px; height: 80px;
    background: var(--yellow);
    border-radius: 50%;
    opacity: 0.1;
  }
  .brand::after {
    content: '';
    position: absolute;
    top: 14px; right: 24px;
    width: 30px; height: 30px;
    background: var(--orange);
    border-radius: 50%;
    opacity: 0.18;
  }
  .brand-row { display: flex; align-items: center; gap: 10px; position: relative; z-index: 1; }
  .brand-logo {
    width: 32px; height: 32px;
    background: var(--yellow);
    border-radius: 8px;
    display: grid;
    place-items: center;
    font-weight: 800;
    color: var(--ink);
    font-family: var(--font-display);
    font-size: 16px;
    box-shadow: 0 3px 10px rgba(255,196,0,0.3);
    flex-shrink: 0;
  }
  .brand-text { flex: 1; min-width: 0; }
  .brand-name {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .brand-name .accent { color: var(--yellow); }
  .brand-sub {
    font-size: 10px;
    color: var(--slate-soft);
    margin-top: 3px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .brand-sub .dot {
    width: 5px; height: 5px;
    background: #4ADE80;
    border-radius: 50%;
    box-shadow: 0 0 6px #4ADE80;
  }
  .brand-stats-inline {
    display: flex;
    gap: 8px;
    margin-left: auto;
    align-items: center;
    position: relative;
    z-index: 1;
  }
  /* Hide stats on narrow sidebar to give space to mode toggle */
  @media (max-width: 1100px) {
    .brand-stats-inline { display: none; }
  }
  body.force-mobile .brand-stats-inline { display: none; }
  .brand-stat-mini {
    text-align: center;
  }
  .brand-stat-mini .num {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 16px;
    color: var(--yellow);
    line-height: 1;
  }
  .brand-stat-mini .lbl {
    font-size: 9px;
    color: var(--slate-soft);
    margin-top: 2px;
    letter-spacing: 0.04em;
  }

  /* Mode toggle — top right */
  .mode-toggle {
    position: relative;
    z-index: 2;
    background: var(--ink-2);
    border: 1px solid var(--ink-3);
    border-radius: 8px;
    padding: 3px;
    display: flex;
    gap: 2px;
    flex-shrink: 0;
  }
  .mode-btn {
    color: var(--slate-soft);
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 700;
    font-family: var(--font-display);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .mode-btn:hover { color: var(--white); }
  .mode-btn.active {
    background: var(--yellow);
    color: var(--ink);
  }
  .mode-btn svg { display: block; }

  /* ===== Hero Finder (COMPACT) ===== */
  .finder {
    padding: 9px 12px 10px;
    background: linear-gradient(180deg, var(--yellow-tint) 0%, var(--white) 100%);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .finder-label { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
  .finder-label-icon {
    width: 22px; height: 22px;
    background: var(--ink);
    color: var(--yellow);
    border-radius: 6px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  .finder-label-text {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 12px;
    color: var(--ink);
  }
  .finder-label-tag {
    margin-left: auto;
    font-size: 9px;
    background: var(--ink);
    color: var(--yellow);
    padding: 2px 7px;
    border-radius: 100px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .finder-input-wrap {
    background: var(--white);
    border: 1.5px solid var(--ink);
    border-radius: 10px;
    padding: 3px;
    display: flex;
    align-items: center;
    box-shadow: 3px 3px 0 var(--ink);
    transition: box-shadow 0.15s;
  }
  .finder-input-wrap:focus-within { box-shadow: 3px 3px 0 var(--orange); }
  .finder-input {
    flex: 1;
    border: none;
    outline: none;
    padding: 7px 11px;
    font-size: 14px;
    background: transparent;
    color: var(--ink);
    min-width: 0;
  }
  .finder-input::placeholder { color: var(--slate-soft); font-size: 13px; }
  .finder-gps {
    background: var(--ink);
    color: var(--yellow);
    border-radius: 7px;
    padding: 7px 10px;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 700;
    transition: all 0.15s;
    flex-shrink: 0;
    min-height: 32px;
  }
  .finder-gps:hover { background: var(--orange); color: var(--white); }
  .finder-gps:active { transform: scale(0.96); }
  .finder-gps.loading { opacity: 0.6; cursor: wait; }
  .finder-quick { margin-top: 8px; }
  .finder-quick-row { display: flex; flex-wrap: wrap; gap: 4px; }
  .quick-chip {
    background: var(--white);
    border: 1px solid var(--ink);
    color: var(--ink);
    padding: 4px 10px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 600;
    transition: all 0.12s;
    min-height: 26px;
  }
  .quick-chip:hover { background: var(--yellow); transform: translateY(-1px); }
  .quick-chip:active { transform: scale(0.96); }

  /* ===== ZONE BAR (COMPACT) ===== */
  .zone-bar {
    background: var(--ink);
    padding: 6px 10px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .zone-bar-scroll {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 2px 2px;
    scroll-snap-type: x proximity;
  }
  .zone-bar-scroll::-webkit-scrollbar { display: none; }
  .zone-tab {
    background: var(--ink-2);
    border: 1px solid var(--ink-3);
    color: var(--slate-soft);
    padding: 5px 10px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s;
    scroll-snap-align: start;
    min-height: 28px;
    font-family: var(--font-display);
  }
  .zone-tab:hover { border-color: var(--yellow); color: var(--white); }
  .zone-tab:active { transform: scale(0.95); }
  .zone-tab.active {
    background: var(--yellow);
    border-color: var(--yellow);
    color: var(--ink);
    box-shadow: 0 2px 8px rgba(255,196,0,0.4);
  }
  .zone-tab .zone-emoji { font-size: 12px; }
  .zone-tab .zone-count {
    background: var(--ink);
    color: var(--yellow);
    padding: 0 5px;
    border-radius: 100px;
    font-size: 9px;
    font-weight: 800;
    min-width: 16px;
    text-align: center;
    line-height: 14px;
  }

  /* ===== CONTEXT BAR (COMPACT) ===== */
  .context-bar {
    padding: 7px 12px;
    background: var(--orange);
    color: var(--white);
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    flex-shrink: 0;
  }
  .context-bar.hidden { display: none; }
  .context-bar .ctx-icon {
    background: var(--white);
    color: var(--orange);
    width: 22px; height: 22px;
    border-radius: 6px;
    display: grid;
    place-items: center;
    font-size: 11px;
    flex-shrink: 0;
  }
  .context-bar .ctx-text { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
  .context-bar .ctx-label {
    font-size: 10px;
    opacity: 0.85;
    font-weight: 600;
  }
  .context-bar .ctx-value {
    font-weight: 800;
    font-family: var(--font-display);
    font-size: 12px;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .context-bar .clear {
    background: rgba(0,0,0,0.25);
    color: var(--white);
    font-size: 10px;
    padding: 4px 9px;
    border-radius: 6px;
    font-weight: 700;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .context-bar .clear:hover { background: var(--ink); }
  .context-bar .clear:active { transform: scale(0.94); }

  /* ===== NEARBY AREAS (COMPACT) ===== */
  .nearby-bar {
    background: var(--yellow-tint);
    border-bottom: 1px solid var(--line);
    padding: 6px 10px 7px;
    flex-shrink: 0;
  }
  .nearby-bar.hidden { display: none; }
  .nearby-bar-label {
    color: var(--slate);
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
    padding: 0 4px 4px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .nearby-bar-label .ico {
    background: var(--orange);
    color: var(--white);
    width: 14px; height: 14px;
    border-radius: 4px;
    display: grid;
    place-items: center;
    font-size: 9px;
  }
  .nearby-scroll {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 2px 2px;
  }
  .nearby-scroll::-webkit-scrollbar { display: none; }
  .nearby-chip {
    background: var(--white);
    border: 1px solid var(--ink);
    color: var(--ink);
    padding: 4px 9px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s;
    min-height: 26px;
  }
  .nearby-chip:hover { background: var(--yellow); transform: translateY(-1px); }
  .nearby-chip:active { transform: scale(0.95); }
  .nearby-chip .nearby-dist {
    background: var(--ink);
    color: var(--yellow);
    font-size: 9px;
    padding: 0 5px;
    border-radius: 100px;
    font-weight: 700;
    line-height: 14px;
  }

  /* ===== LIST HEADER (COMPACT) ===== */
  .list-header {
    padding: 7px 12px 5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .list-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 11px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .list-count {
    background: var(--yellow);
    color: var(--ink);
    padding: 1px 7px;
    border-radius: 100px;
    font-size: 10px;
    font-weight: 800;
  }
  .list-sort-info { font-size: 10px; color: var(--slate); font-weight: 500; }

  .list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 2px 8px 12px; min-height: 0; }
  .list::-webkit-scrollbar { width: 6px; }
  .list::-webkit-scrollbar-track { background: transparent; }
  .list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .list::-webkit-scrollbar-thumb:hover { background: var(--slate-soft); }

  /* ===== CARD (COMPACT) ===== */
  .card {
    background: var(--white);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    padding: 9px 11px;
    margin-bottom: 5px;
    cursor: pointer;
    transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .card:hover { border-color: var(--ink); transform: translateY(-1px); box-shadow: var(--shadow); }
  .card:active { transform: scale(0.99); }
  .card.active { border-color: var(--ink); background: var(--yellow-tint); box-shadow: 3px 3px 0 var(--ink); }
  .card.nearest {
    border-color: var(--orange);
    background: linear-gradient(135deg, var(--white) 0%, var(--orange-soft) 100%);
  }
  .card-top { display: flex; align-items: flex-start; gap: 8px; }
  .card-rank {
    flex-shrink: 0;
    width: 26px; height: 26px;
    background: var(--ink);
    color: var(--yellow);
    border-radius: 7px;
    display: grid;
    place-items: center;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 11px;
  }
  .card.nearest .card-rank {
    background: var(--orange);
    color: var(--white);
    box-shadow: 0 3px 10px rgba(255,107,26,0.4);
  }
  .card-body { flex: 1; min-width: 0; }
  .card-name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    color: var(--ink);
    line-height: 1.25;
    margin-bottom: 2px;
  }
  .card-landmark { font-size: 11px; color: var(--slate); line-height: 1.4; }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 7px;
    flex-wrap: wrap;
  }
  .card-zone {
    font-size: 9px;
    background: var(--line-soft);
    color: var(--slate);
    padding: 2px 7px;
    border-radius: 100px;
    font-weight: 600;
  }
  .card-distance {
    font-size: 10px;
    color: var(--orange-deep);
    font-weight: 700;
  }
  .nearest-badge {
    font-size: 9px;
    background: var(--orange);
    color: var(--white);
    padding: 2px 7px;
    border-radius: 100px;
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  .card-actions {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 4px;
    margin-top: 7px;
  }
  .card-action {
    background: var(--white);
    border: 1px solid var(--line);
    color: var(--slate);
    padding: 5px 4px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 600;
    transition: all 0.12s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    text-decoration: none;
    min-height: 26px;
  }
  .card-action:hover { border-color: var(--ink); background: var(--yellow); color: var(--ink); }
  .card-action:active { transform: scale(0.95); }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--slate); }
  .empty-icon {
    width: 56px; height: 56px;
    background: var(--yellow-soft);
    border-radius: 50%;
    margin: 0 auto 12px;
    display: grid;
    place-items: center;
    font-size: 24px;
  }
  .empty-title {
    font-family: var(--font-display);
    font-weight: 700;
    color: var(--ink);
    font-size: 14px;
    margin-bottom: 6px;
  }
  .empty-text { font-size: 12px; line-height: 1.5; }

  /* ===== MAP ===== */
  .map-wrap { position: relative; background: #DDD; }
  #map {
    width: 100%;
    height: 100%;
    background: #DDD;
    -webkit-tap-highlight-color: transparent;
  }
  .leaflet-tile-container img { opacity: 1 !important; }
  .leaflet-tile { will-change: transform; }

  .map-controls { position: absolute; top: 14px; right: 14px; z-index: 600; display: flex; gap: 6px; }
  .map-ctrl {
    background: var(--white);
    border: 1.5px solid var(--ink);
    color: var(--ink);
    padding: 7px 11px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    box-shadow: 2px 2px 0 var(--ink);
    transition: all 0.12s;
    display: flex;
    align-items: center;
    gap: 5px;
    min-height: 32px;
  }
  .map-ctrl:hover { background: var(--yellow); transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
  .map-ctrl:active { transform: scale(0.96); }

  .style-switcher { position: absolute; bottom: 70px; right: 14px; z-index: 500; }
  .style-toggle {
    background: var(--white);
    border: 1.5px solid var(--ink);
    color: var(--ink);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    box-shadow: 2px 2px 0 var(--ink);
    transition: all 0.12s;
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 34px;
  }
  .style-toggle:hover { background: var(--yellow); transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
  .style-toggle:active { transform: scale(0.96); }
  .style-panel {
    position: absolute;
    bottom: calc(100% + 8px);
    right: 0;
    background: var(--white);
    border: 1.5px solid var(--ink);
    border-radius: 12px;
    box-shadow: 5px 5px 0 var(--ink);
    padding: 12px;
    min-width: 270px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(8px);
    transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .style-switcher.open .style-panel { opacity: 1; visibility: visible; transform: translateY(0); }
  .style-panel-title {
    font-family: var(--font-display);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--slate);
    margin-bottom: 8px;
    font-weight: 700;
  }
  .style-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .style-btn {
    background: var(--paper);
    border: 1.5px solid transparent;
    border-radius: 8px;
    padding: 8px 10px;
    transition: all 0.12s;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1px;
    text-align: left;
  }
  .style-btn:hover { background: var(--yellow-tint); border-color: var(--yellow); }
  .style-btn.active { background: var(--ink); border-color: var(--ink); color: var(--yellow); }
  .style-btn.active .style-desc { color: var(--slate-soft); }
  .style-icon { font-size: 16px; margin-bottom: 1px; }
  .style-label { font-family: var(--font-display); font-size: 11px; font-weight: 700; }
  .style-desc { font-size: 9px; color: var(--slate); }

  /* Popup */
  .leaflet-popup-content-wrapper {
    border-radius: 12px;
    border: 1.5px solid var(--ink);
    box-shadow: 5px 5px 0 var(--ink);
    padding: 0;
  }
  .leaflet-popup-content { margin: 0; min-width: 240px; font-family: var(--font-body); }
  .leaflet-popup-tip { background: var(--ink); }
  .leaflet-popup-close-button { color: var(--ink) !important; font-size: 22px !important; padding: 6px 10px 0 0 !important; }
  .popup { padding: 12px 14px; }
  .popup-zone {
    display: inline-block;
    background: var(--yellow);
    color: var(--ink);
    padding: 2px 9px;
    border-radius: 100px;
    font-size: 10px;
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

let currentStyleKey = 'street';
let activeTileLayer = null;
let tileCheckTimer = null;

function loadMapStyle(styleKey) {
  currentStyleKey = styleKey;
  document.querySelectorAll('.style-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.style === styleKey);
  });
  tryProvider(0);
}

function tryProvider(idx) {
  const style = MAP_STYLES[currentStyleKey];
  if (idx >= style.providers.length) return;
  const cfg = style.providers[idx];
  if (activeTileLayer) { map.removeLayer(activeTileLayer); activeTileLayer = null; }
  if (tileCheckTimer) clearTimeout(tileCheckTimer);

  const layer = L.tileLayer(cfg.url, {
    attribution: cfg.attribution,
    subdomains: cfg.subdomains || 'abc',
    maxZoom: cfg.maxZoom,
    crossOrigin: true
  });

  let succeeded = false, errorCount = 0;
  layer.on('tileload', () => { if (!succeeded) { succeeded = true; clearTimeout(tileCheckTimer); } });
  layer.on('tileerror', () => {
    errorCount++;
    if (errorCount >= 4 && !succeeded && activeTileLayer === layer) {
      clearTimeout(tileCheckTimer);
      activeTileLayer = null;
      map.removeLayer(layer);
      tryProvider(idx + 1);
    }
  });
  tileCheckTimer = setTimeout(() => {
    if (!succeeded && activeTileLayer === layer) {
      activeTileLayer = null;
      map.removeLayer(layer);
      tryProvider(idx + 1);
    }
  }, 6000);

  layer.addTo(map);
  activeTileLayer = layer;
}

loadMapStyle('street');

setTimeout(() => map.invalidateSize(), 200);
window.addEventListener('resize', () => { setTimeout(() => map.invalidateSize(), 100); });
window.addEventListener('orientationchange', () => { setTimeout(() => map.invalidateSize(), 300); });

function makePinIcon(rank, isNearest) {
  const bg = isNearest ? '#FF6B1A' : '#0E0E10';
  const txt = isNearest ? '#FFFFFF' : '#FFC400';
  const ring = isNearest ? '#FFFFFF' : '#FFC400';
  return L.divIcon({
    className: 'pin-icon',
    html: `<div style="position:relative;width:34px;height:44px;">
      <svg width="34" height="44" viewBox="0 0 36 46" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 0 C8 0 0 8 0 18 C0 30 18 46 18 46 C18 46 36 30 36 18 C36 8 28 0 18 0 Z" fill="${bg}" stroke="${ring}" stroke-width="2"/>
        <circle cx="18" cy="17" r="11" fill="${txt}"/>
        <text x="18" y="21" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="12" fill="${bg}">${rank}</text>
      </svg>
    </div>`,
    iconSize: [34, 44],
    iconAnchor: [17, 44],
    popupAnchor: [0, -40]
  });
}

function makeUserIcon() {
  return L.divIcon({
    className: 'user-pin',
    html: `<div style="position:relative;width:48px;height:48px;display:flex;align-items:center;justify-content:center;">
      <div style="position:absolute;width:48px;height:48px;background:#FF6B1A;border-radius:50%;opacity:0.25;animation:userPulse 2s infinite;"></div>
      <div style="position:absolute;width:32px;height:32px;background:#FF6B1A;border-radius:50%;opacity:0.4;animation:userPulse 2s infinite 0.4s;"></div>
      <div style="position:relative;width:18px;height:18px;background:#FF6B1A;border:3px solid #fff;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,0.4);z-index:2;"></div>
    </div>
    <style>@keyframes userPulse{0%{transform:scale(0.5);opacity:0.5;}100%{transform:scale(1.5);opacity:0;}}</style>`,
    iconSize: [48, 48],
    iconAnchor: [24, 24]
  });
}

function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.asin(Math.sqrt(a));
}

function formatDist(km) {
  if (km < 1) return Math.round(km * 1000) + ' ม.';
  if (km < 10) return km.toFixed(1) + ' กม.';
  return Math.round(km) + ' กม.';
}

function findArea(query) {
  const q = query.trim().toLowerCase();
  if (!q) return null;
  for (const a of AREAS) {
    for (const k of a.keys) {
      if (k.toLowerCase() === q) return a;
    }
  }
  for (const a of AREAS) {
    for (const k of a.keys) {
      if (k.toLowerCase().includes(q) || q.includes(k.toLowerCase())) return a;
    }
  }
  return null;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

function renderZoneBar() {
  const counts = { all: BRANCHES.length };
  Object.keys(ZONES).forEach(z => counts[z] = 0);
  BRANCHES.forEach(b => counts[b.zone]++);

  const wrap = document.getElementById('zoneBar');
  wrap.innerHTML = '';

  const all = document.createElement('button');
  all.className = 'zone-tab' + (activeZone === 'all' ? ' active' : '');
  all.innerHTML = `<span class="zone-emoji">🌐</span><span>ทั้งหมด</span><span class="zone-count">${counts.all}</span>`;
  all.onclick = () => { activeZone = 'all'; renderZoneBar(); renderList(); applyFilter(); };
  wrap.appendChild(all);

  Object.entries(ZONES).forEach(([key, z]) => {
    if (counts[key] === 0) return;
    const btn = document.createElement('button');
    btn.className = 'zone-tab' + (activeZone === key ? ' active' : '');
    btn.innerHTML = `<span class="zone-emoji">${z.emoji}</span><span>${z.tab}</span><span class="zone-count">${counts[key]}</span>`;
    btn.onclick = () => {
      activeZone = key;
      renderZoneBar();
      renderList();
      applyFilter();
      btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    };
    wrap.appendChild(btn);
  });
}

function renderQuickChips() {
  const wrap = document.getElementById('quickAreas');
  wrap.innerHTML = '';
  QUICK_AREAS.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'quick-chip';
    btn.textContent = name;
    btn.onclick = () => {
      document.getElementById('finder').value = name;
      runSearch(name);
    };
    wrap.appendChild(btn);
  });
}

function renderNearbyAreas() {
  const bar = document.getElementById('nearbyBar');
  if (!searchContext) {
    bar.classList.add('hidden');
    return;
  }
  const nearby = AREAS
    .filter(a => a.name !== searchContext.name)
    .map(a => ({ ...a, dist: haversine(searchContext.lat, searchContext.lng, a.lat, a.lng) }))
    .sort((a, b) => a.dist - b.dist)
    .slice(0, 6);

  if (nearby.length === 0) { bar.classList.add('hidden'); return; }

  bar.classList.remove('hidden');
  const scroll = document.getElementById('nearbyScroll');
  scroll.innerHTML = '';
  nearby.forEach(a => {
    const chip = document.createElement('button');
    chip.className = 'nearby-chip';
    chip.innerHTML = `<span>${a.name}</span><span class="nearby-dist">${formatDist(a.dist)}</span>`;
    chip.onclick = () => {
      document.getElementById('finder').value = a.keys[0];
      runSearch(a.keys[0]);
      scroll.scrollLeft = 0;
    };
    scroll.appendChild(chip);
  });
}

function getDisplayBranches() {
  let list = BRANCHES.map((b, idx) => ({ ...b, idx }));
  if (activeZone !== 'all') list = list.filter(b => b.zone === activeZone);

  if (searchContext) {
    list = list.map(b => ({ ...b, distance: haversine(searchContext.lat, searchContext.lng, b.lat, b.lng) }));
    list.sort((a, b) => a.distance - b.distance);
  } else {
    const zoneOrder = ['north','east','west','southbkk','pattaya','south','isan'];
    list.sort((a, b) => zoneOrder.indexOf(a.zone) - zoneOrder.indexOf(b.zone));
  }
  return list;
}

function renderList() {
  const list = getDisplayBranches();
  const container = document.getElementById('list');
  container.innerHTML = '';

  document.getElementById('listCount').textContent = list.length;
  document.getElementById('sortInfo').textContent = searchContext ? '⚡ ใกล้-ไกล' : 'เรียงตามโซน';

  if (list.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">ไม่พบสาขาในโซนนี้</div><div class="empty-text">ลองเปลี่ยนโซน หรือล้างตัวกรอง</div></div>`;
    return;
  }

  list.forEach((b, displayIdx) => {
    const isNearest = searchContext && displayIdx === 0;
    const isActive = activeBranchIdx === b.idx;

    const card = document.createElement('div');
    card.className = 'card' + (isActive ? ' active' : '') + (isNearest ? ' nearest' : '');

    const rankNum = displayIdx + 1;
    const distHtml = b.distance != null ? `<span class="card-distance">📍 ${formatDist(b.distance)}</span>` : '';
    const nearestBadge = isNearest ? `<span class="nearest-badge">ใกล้สุด</span>` : '';

    card.innerHTML = `
      <div class="card-top">
        <div class="card-rank">${rankNum}</div>
        <div class="card-body">
          <div class="card-name">${b.name}</div>
          <div class="card-landmark">${b.landmark}</div>
          <div class="card-meta">
            <span class="card-zone">${ZONES[b.zone].emoji} ${ZONES[b.zone].short}</span>
            ${distHtml}
            ${nearestBadge}
          </div>
        </div>
      </div>
      <div class="card-actions">
        <a class="card-action" href="https://www.google.com/maps/search/?api=1&query=${b.lat},${b.lng}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Google</a>
        <a class="card-action" href="https://maps.apple.com/?ll=${b.lat},${b.lng}&q=${encodeURIComponent(b.name)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Apple</a>
        <button class="card-action" onclick="event.stopPropagation();window.copyCoord(${b.lat},${b.lng})">📋 พิกัด</button>
      </div>
    `;

    card.onclick = () => focusBranch(b.idx);
    container.appendChild(card);
  });
}

window.copyCoord = function(lat, lng) {
  const text = `${lat},${lng}`;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('📋 คัดลอกพิกัดแล้ว')).catch(() => showToast('📋 ' + text));
  } else {
    showToast('📋 ' + text);
  }
};

function isMobileView() {
  return document.body.classList.contains('force-mobile') ||
    (!document.body.classList.contains('force-pc') && window.innerWidth <= 900);
}

function renderMarkers() {
  Object.values(markers).forEach(m => map.removeLayer(m));
  Object.keys(markers).forEach(k => delete markers[k]);

  const list = getDisplayBranches();

  list.forEach((b, displayIdx) => {
    const isNearest = searchContext && displayIdx === 0;
    const rank = displayIdx + 1;
    const marker = L.marker([b.lat, b.lng], { icon: makePinIcon(rank, isNearest) }).addTo(map);

    const distLine = b.distance != null
      ? `<div style="font-size:11px;color:#FF6B1A;font-weight:700;margin-bottom:6px;">📍 ห่าง ${formatDist(b.distance)} จาก${searchContext.name === 'ตำแหน่งของฉัน' ? 'คุณ' : ' ' + searchContext.name}</div>`
      : '';

    const popupHtml = `
      <div class="popup">
        <div class="popup-zone">${ZONES[b.zone].emoji} ${ZONES[b.zone].short}</div>
        <div class="popup-title">${b.name}</div>
        <div class="popup-landmark">${b.landmark}</div>
        ${distLine}
        <div class="popup-coord">${b.lat.toFixed(6)}, ${b.lng.toFixed(6)}</div>
        <div class="popup-actions">
          <a class="popup-btn primary" href="https://www.google.com/maps/dir/?api=1&destination=${b.lat},${b.lng}" target="_blank" rel="noopener">นำทาง Google</a>
          <a class="popup-btn secondary" href="https://maps.apple.com/?daddr=${b.lat},${b.lng}" target="_blank" rel="noopener">นำทาง Apple</a>
        </div>
      </div>
    `;

    marker.bindPopup(popupHtml, { maxWidth: 320, className: 'wg-popup' });
    marker.on('click', () => { activeBranchIdx = b.idx; renderList(); });
    markers[b.idx] = marker;
  });
}

function applyFilter() {
  renderMarkers();
  const isMobile = isMobileView();

  if (searchContext) {
    if (userMarker) map.removeLayer(userMarker);
    userMarker = L.marker([searchContext.lat, searchContext.lng], { icon: makeUserIcon(), zIndexOffset: 1000 }).addTo(map);
    userMarker.bindPopup(`<div style="padding:8px 12px;font-weight:700;font-size:13px;">📍 ${searchContext.name}</div>`);

    const list = getDisplayBranches().slice(0, 3);
    const bounds = L.latLngBounds([[searchContext.lat, searchContext.lng]]);
    list.forEach(b => bounds.extend([b.lat, b.lng]));
    if (isMobile) {
      map.fitBounds(bounds, { paddingTopLeft: [40, 40], paddingBottomRight: [40, 220], maxZoom: 14 });
    } else {
      map.fitBounds(bounds, { padding: [80, 80], maxZoom: 14 });
    }
  } else {
    if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
    if (activeZone !== 'all') {
      const list = getDisplayBranches();
      if (list.length > 0) {
        const bounds = L.latLngBounds(list.map(b => [b.lat, b.lng]));
        if (isMobile) {
          map.fitBounds(bounds, { paddingTopLeft: [30, 30], paddingBottomRight: [30, 220], maxZoom: 13 });
        } else {
          map.fitBounds(bounds, { padding: [60, 60], maxZoom: 13 });
        }
      }
    } else {
      map.setView([13.75, 100.55], 11);
    }
  }
}

function focusBranch(idx) {
  activeBranchIdx = idx;
  const b = BRANCHES[idx];
  const isMobile = isMobileView();
  if (isMobile) collapseSheet();

  if (isMobile) {
    const targetPoint = map.project([b.lat, b.lng], 16).subtract([0, -80]);
    const targetLatLng = map.unproject(targetPoint, 16);
    map.flyTo(targetLatLng, 16, { duration: 0.6 });
  } else {
    map.flyTo([b.lat, b.lng], 16, { duration: 0.7 });
  }

  setTimeout(() => { if (markers[idx]) markers[idx].openPopup(); }, isMobile ? 700 : 750);
  renderList();
}

function runSearch(query) {
  const area = findArea(query);
  if (!area) { showToast('❌ ไม่พบย่าน "' + query + '"'); return; }
  searchContext = { type: 'area', name: area.name, lat: area.lat, lng: area.lng };
  showContext();
  activeZone = 'all';
  renderZoneBar();
  renderNearbyAreas();
  renderList();
  applyFilter();
  showToast('🎯 พบสาขาใกล้ ' + area.name);
}

function showContext() {
  const bar = document.getElementById('contextBar');
  if (searchContext) {
    bar.classList.remove('hidden');
    document.getElementById('contextValue').textContent = searchContext.name;
  } else {
    bar.classList.add('hidden');
  }
}

function clearSearch() {
  searchContext = null;
  document.getElementById('finder').value = '';
  showContext();
  renderNearbyAreas();
  renderList();
  applyFilter();
}

function useGPS() {
  if (!navigator.geolocation) { showToast('❌ เบราว์เซอร์ไม่รองรับ GPS'); return; }
  const btn = document.getElementById('gpsBtn');
  btn.classList.add('loading');
  const originalHTML = btn.innerHTML;
  btn.innerHTML = '<span style="font-size:10px">กำลังหา...</span>';

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      searchContext = { type: 'gps', name: 'ตำแหน่งของฉัน', lat: pos.coords.latitude, lng: pos.coords.longitude };
      document.getElementById('finder').value = '📍 ตำแหน่งของฉัน';
      showContext();
      activeZone = 'all';
      renderZoneBar();
      renderNearbyAreas();
      renderList();
      applyFilter();
      showToast('✅ ใช้ตำแหน่งจริง');
      btn.classList.remove('loading');
      btn.innerHTML = originalHTML;
    },
    () => {
      showToast('❌ ไม่สามารถหาตำแหน่งได้');
      btn.classList.remove('loading');
      btn.innerHTML = originalHTML;
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

const finderInput = document.getElementById('finder');
finderInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && finderInput.value.trim()) {
    finderInput.blur();
    runSearch(finderInput.value.trim());
  }
});

document.getElementById('gpsBtn').addEventListener('click', useGPS);
document.getElementById('clearContext').addEventListener('click', clearSearch);

document.getElementById('resetView').addEventListener('click', () => {
  activeZone = 'all';
  searchContext = null;
  document.getElementById('finder').value = '';
  showContext();
  renderNearbyAreas();
  activeBranchIdx = null;
  renderZoneBar();
  renderList();
  applyFilter();
  map.setView([13.75, 100.55], 11);
});

const styleSwitcher = document.getElementById('styleSwitcher');
const styleToggle = document.getElementById('styleToggle');
styleToggle.addEventListener('click', (e) => {
  e.stopPropagation();
  styleSwitcher.classList.toggle('open');
});
document.addEventListener('click', (e) => {
  if (!styleSwitcher.contains(e.target)) styleSwitcher.classList.remove('open');
});
document.querySelectorAll('.style-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const styleKey = btn.dataset.style;
    if (styleKey === currentStyleKey) return;
    loadMapStyle(styleKey);
    setTimeout(() => styleSwitcher.classList.remove('open'), 200);
  });
});

// ============ MOBILE BOTTOM SHEET ============
const sidebar = document.getElementById('sidebar');
const handle = document.getElementById('sheetHandle');
const fab = document.getElementById('mobileFab');
const appEl = document.querySelector('.app');

function expandSheet() {
  sidebar.classList.remove('collapsed');
  appEl.classList.remove('sheet-collapsed');
  setTimeout(() => map.invalidateSize(), 320);
}

function collapseSheet() {
  sidebar.classList.add('collapsed');
  appEl.classList.add('sheet-collapsed');
  setTimeout(() => map.invalidateSize(), 320);
}

handle.addEventListener('click', () => {
  if (sidebar.classList.contains('collapsed')) expandSheet();
  else collapseSheet();
});

let dragStartY = null;
handle.addEventListener('touchstart', (e) => {
  dragStartY = e.touches[0].clientY;
  sidebar.style.transition = 'none';
}, { passive: true });

handle.addEventListener('touchmove', (e) => {
  if (dragStartY == null) return;
  const dy = e.touches[0].clientY - dragStartY;
  if (sidebar.classList.contains('collapsed') && dy < 0) {
    sidebar.style.transform = '';
  } else if (!sidebar.classList.contains('collapsed') && dy > 0) {
    // allow visual drag
  }
}, { passive: true });

handle.addEventListener('touchend', (e) => {
  if (dragStartY == null) return;
  const endY = e.changedTouches[0].clientY;
  const dy = endY - dragStartY;
  sidebar.style.transition = '';
  sidebar.style.transform = '';
  if (sidebar.classList.contains('collapsed') && dy < -50) expandSheet();
  else if (!sidebar.classList.contains('collapsed') && dy > 80) collapseSheet();
  dragStartY = null;
});

if (fab) fab.addEventListener('click', expandSheet);

finderInput.addEventListener('focus', () => {
  if (isMobileView() && sidebar.classList.contains('collapsed')) expandSheet();
});

// ============ MODE TOGGLE (Auto / PC / Mobile) ============
const MODE_KEY = 'wg-display-mode';
let currentMode = localStorage.getItem(MODE_KEY) || 'auto';

function applyMode(mode) {
  currentMode = mode;
  localStorage.setItem(MODE_KEY, mode);
  document.body.classList.remove('force-pc', 'force-mobile');

  if (mode === 'pc') document.body.classList.add('force-pc');
  else if (mode === 'mobile') document.body.classList.add('force-mobile');
  // 'auto' = no class, lets media query decide

  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });

  // Reset sheet state per mode
  if (mode === 'pc') {
    sidebar.classList.remove('collapsed');
    appEl.classList.remove('sheet-collapsed');
  } else {
    // mobile or auto-on-small-screen: collapse by default
    if (mode === 'mobile' || window.innerWidth <= 900) {
      sidebar.classList.add('collapsed');
      appEl.classList.add('sheet-collapsed');
    } else {
      sidebar.classList.remove('collapsed');
      appEl.classList.remove('sheet-collapsed');
    }
  }

  setTimeout(() => map.invalidateSize(), 350);
}

document.querySelectorAll('.mode-btn').forEach(b => {
  b.addEventListener('click', () => {
    applyMode(b.dataset.mode);
    showToast(b.dataset.mode === 'auto' ? '🔄 โหมดอัตโนมัติ' : b.dataset.mode === 'pc' ? '🖥️ โหมด PC' : '📱 โหมดมือถือ');
  });
});

// Apply saved mode on load
applyMode(currentMode);

// ============ INIT ============
const provinces = new Set();
BRANCHES.forEach(b => {
  if (b.zone === 'south') provinces.add('สงขลา');
  else if (b.zone === 'isan') provinces.add('ขอนแก่น');
  else if (b.zone === 'pattaya') provinces.add('ชลบุรี');
  else provinces.add('กรุงเทพฯ-ปริมณฑล');
});
document.getElementById('stat-total').textContent = BRANCHES.length;
document.getElementById('stat-zones').textContent = Object.keys(ZONES).length;

renderZoneBar();
renderQuickChips();
renderList();
renderMarkers();

setTimeout(() => {
  const loading = document.getElementById('loading');
  loading.classList.add('hide');
  setTimeout(() => loading.style.display = 'none', 400);
  setTimeout(() => map.invalidateSize(), 500);
}, 600);

}
});
</script>
